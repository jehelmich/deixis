name: Release

# Tag a commit `vX.Y.Z` and the debug-signed demo APK is attached to a GitHub release, so the
# app can be tried without a toolchain. Debug signing is deliberate: there is no Play listing
# and no signing key to keep secret.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0 build-tools;36.0.0 platform-tools

      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew testDebugUnitTest assembleDebug

      - name: Name the APK after the tag
        run: cp app/build/outputs/apk/debug/app-debug.apk "deixis-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: deixis-*.apk
          generate_release_notes: true
