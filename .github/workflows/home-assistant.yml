name: Home Assistant

# Boots the demo Home Assistant from homeassistant/ in Docker, onboards it, and runs the
# live client tests against it — the real REST API and real (demo) entities, not a mock.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: Live client tests against a real instance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v5

      - name: Start and onboard Home Assistant
        working-directory: homeassistant
        run: |
          ./up.sh
          echo "DEIXIS_HA_TOKEN=$(cat .token)" >> "$GITHUB_ENV"
          echo "DEIXIS_HA_URL=http://localhost:8123" >> "$GITHUB_ENV"

      - name: Run the live tests
        run: ./gradlew testDebugUnitTest --tests '*HomeAssistantLiveTest*'

      - name: Home Assistant log
        if: failure()
        working-directory: homeassistant
        run: docker compose logs --no-color | tail -100

      - name: Stop Home Assistant
        if: always()
        working-directory: homeassistant
        run: docker compose down -v
